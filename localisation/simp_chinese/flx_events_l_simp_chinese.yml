lsw_event.4.a:0 "庸医！"
lsw_event.5.t:0 "井下乾坤"
lsw_event.5.desc:0 "1968年5月6日的黄田坝，这是雷绍武最难玩的一天。那天132与826爆发了旷日持久的大战，打死了一些人，甚至使用了热武器。可在大战之下，雷绍武听着人上一百形形色色的嚎叫声，心中十分伤心，万分难过。\n人渣垃圾表现！我从来不参加文斗，更别提什么武斗，他想。\n井盖下很冷，血液滴答下来。他屏住呼吸。忽然，他看到井盖下一道银白色的小身影闪过。它趴在雷绍武脚边，井盖下空洞透过的光亮。雷隐约看清了它：一只银白色的猫，背上有着两条黄蓝的长条。\n“雷雷雷！”\n“绍武莫慌！外面都是伟大的wcjj斗士，为了民主与自由，和未来的，不过绍武你还不清楚，我们来自未来。”\n雷绍武一惊，这暴露了位置可咋整？立刻慌了，想张开嘴，可发现他怎么也张不开。\n“绍武，不要惊慌。这里已经被我们下了结界，我是你之后最忠实的门徒，银海透冰河，我背上的是街角，也是您忠实的信徒。”\n“您可能什么也不知道，但是，只需要知道——我们来自未来，我们暂时失败，我们回到过去，我们从没失败，最吧永远灭亡！”"
lsw_event.5.a:0 "——“这什么玩意？”"
lsw_event.6.t:0 "建立1113战斗队"
lsw_event.6.desc:0 "孔老二曾曰，既来之，则安之。我们在这里，虽然不知道什么原因，但是无论如何，我们还是来了，我们要立足于此，这是危机，也是机遇……\n成都132厂在的地方，在现在仍是一片空地。游寿星和江海云站在那，一起做着领导训话。内容是什么？雷绍武早已记不清了，但游团长的英姿，精神仍在直到雷老师从领导岗位退休时仍铭记在心，以至于创作了惊世巨作《团长训话》……雷绍武如此想着。他接受着银海的记忆灌输，那是来自另一个时空的自己，彼此纠缠着。他知道，那个世界的自己背叛队友，躲进井盖，晚年仍十分无知，万分无赖。可时间已发生了变化。于是，雷绍武审视着自己，抓住了未来——用那个世界叫“雷绍武”的人，那个未来的他。"
lsw_event.6.a:0 "“老产，你还记得我不？”"
