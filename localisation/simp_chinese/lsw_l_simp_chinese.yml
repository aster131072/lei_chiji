dabang_desc:0 "大棒派，是主要对雷绍武使用大棒殴打，使之不再膨胀的派系。"
xiangjiao_desc:0 "香蕉派，是主要对雷绍武使用香蕉安抚，使之多多表现的派系。"
pingheng_desc:0 "平衡派，是在对雷绍武使用香蕉与大棒之间反复横跳的派系。"
choose_c_desc:0 "选C派，是希望破坏世界反雷协会的派系。"
choose_c_fascism_desc:0 "选C的目的是统治反雷协会。"
choose_c_communism_desc:0 "选C的目的是消灭一切妖派。"
choose_c_neutrality_desc:0 "选C是因为信他所信的。"
choose_c_democratic_desc:0 "选C是因为喜欢闹事。"
 YOUSHOUXING_DESC:0 "团长"
 XUANLVLAN_DESC:0 "最爱春雷吧吧主"
 LEISHAOWU_DESC:0 "背叛战友，躲进井盖"
GATHERING_STORM_NAME1:0 "一梦全能"
GATHERING_STORM_DESC1:0 "八二六战斗团在四川崛起，世界反雷协会暗中操纵全世界……谁将成为新世界的主宰？"
LSW_GATHERING_STORM_DESC:0 "穿越时空的八二六战斗团，到达了1936年的四川。然而，同时穿越而来的还有八二六战斗团的敌人产业军、红成；不知从什么时代到来的理塘王；以及暗中窥伺的雷绍武、世界反雷协会。八二六战斗团能够在这个时代重新崛起吗？"
FLX_GATHERING_STORM_DESC:0 "在世界反雷协会肉体消灭雷绍武时，雷绍武启动了时光机，让各种东西都穿越到了1936年。在这混乱的时代中，世界反雷协会不仅要对外扩张自身的势力，还要提防内部的分裂分子。世界反雷协会能够真正消灭雷绍武吗？"