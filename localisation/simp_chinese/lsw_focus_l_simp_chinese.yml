 ANTI_CYJ_FACTION:0 "反产业军联盟"
 LSW_War_2:0 "攻打132厂"
 LSW_War_2_desc:0 "是时候对产业军发动总攻了！敌人在成都仍有一定势力，要小心。"
 LSW_War_3:0 "拉拢雪豹王国"
 LSW_War_3_desc:0 "产业军太过强大，我们需要更多盟友。"
 LSW_War_5:0 "退守重庆"
 LSW_War_5_desc:0 "我们已经失败了。哪怕如此，也要进行最后一搏！反对的全都驱逐出去！"
 LSW_War_4:0 "掠夺132厂"
 LSW_War_4_desc:0 "我们已经攻占了132厂。我们将使用其中的流水线制造军火，武装自己。"
 LSW_War_6:0 "有限胜利"
 LSW_War_6_desc:0 "在山地中与产业军的战斗已经拖太久了。还好我们夺取了成都，先把他们驱逐到郊区，来日再战。"
 LSW_War_7:0 "意外之喜"
 LSW_War_7_desc:0 "产业军率先动用热武器的行为严重影响了他们的声誉，现在他们失去军方支持，已经没有能力东山再起了。"
 LSW_Win_1:0 "庆祝胜利"
 LSW_Win_1_desc:0 "产业军彻底失败，成都市区欢庆胜利。"
 LSW_Win_2:0 "积累经验"
 LSW_Win_2_desc:0 "在与产业军的战斗中，我们学到了很多东西。"
 LSW_Win_3:0 "与红成决裂"
 LSW_Win_3_desc:0 "红成的理念与我们冲突太多。打败红成，成为唯一的真理！"
 LSW_War_8:0 "攻打红成"
 LSW_War_8_desc:0 "宣传已经足够。是时候彻底控制局势了！"
 LSW_War_9:0 "统一四川"
 LSW_War_9_desc:0 "四川革命注定将要由八二六领导。这就是我们的昭昭天命。"
 LSW_Army_C:0 "扩充军队I"
 LSW_Army_C_desc:0 "在新占领的地区有很多人希望加入这个革命的队伍。"
 LSW_Army_D:0 "扩充军队II"
 LSW_Army_D_desc:0 "在新占领的地区有很多人希望加入这个革命的队伍。"
 LSW_Ways_You:0 "领袖游寿星"
 LSW_Ways_You_desc:0 "我们支持游司令，他将带领我们走向将来的道路。"
 LSW_Ways_You_END:0 "西南霸主"
 LSW_Ways_You_END_desc:0 "在游司令的领导下，八二六战斗团将把四川建设得越来越好。"
 LSW_Ways_You_END_REAL:0 "天无二日"
 LSW_Ways_You_END_REAL_desc:0 "该换个tag玩了。"
 LSW_Ways_Lei:0 "领袖雷绍武"
 LSW_Ways_Lei_desc:0 "雷氏理论唯一正确！！！！！"
 LSW_Ways_Lei_1:0 "雷氏理论研究"
 LSW_Ways_Lei_1_desc:0 "召集咏雷电子，开展雷氏理论研究！"
 LSW_Ways_Jiang:0 "领袖江海云"
 LSW_Ways_Jiang_desc:0 "江政委才是团长更好的人选。"
 LSW_Ways_Jiang_1:0 "扩张势力"
 LSW_Ways_Jiang_1_desc:0 "我们并不满足于四川一省。我们将把势力扩张到整个西部！"
 LSW_Ways_Jiang_2:0 "时日无多？"
 LSW_Ways_Jiang_2_desc:0 "我们可能将要开始一场与时间的赛跑，也可能我们已经输了。但我们可以付出一些代价来在接下来的一段时间里获得很大的方便。"
 LSW_Ways_Jiang_END:0 "统一"
 LSW_Ways_Jiang_END_desc:0 "是时候结束一切了。"
 LSW_Research_A1:0 "开展科技研究"
 LSW_Research_A1_desc:0 "科技研究尤其是物理，是雷氏创新理论的基础与核心，更是雷老师的心血。虽然现在处于斗争的间歇期，这也没有做研究的地方，但我们还是不要忘了这个传统的好。"
 LSW_Research_A2:0 "建立雷氏研究所"
 LSW_Research_A2_desc:0 "雷老师总是喜欢歇后语：狂风吹不动泰山，乌云遮不住太阳。是啊，真理雷说的真对。我们很快就在这一穷二白的土地上建立了我们小小的研究所——可是，这是不是也太快了？"
 LSW_Research_A3:0 "进行颅内实验"
 LSW_Research_A3_desc:0 "太快了，快的不可思议，我们的成果出的太快了，真的能武装起我们的团员，造福全人类吗？于是，我怀着疑问，敲响了雷老师的门。听了我的疑问，雷老师哈哈大笑。不打紧，雷氏创新理论是放之四海而皆准的，任何人都可以慢慢去实验！嗯，是吧，一定是真的。"
 LSW_Research_A4:0 "推翻管科理论"
 LSW_Research_A4_desc:0 "俗话说，无知时质疑，有知时追随。但雷老师说，你无知可以，但不要无德……我为什么不能成为有知有德的人呢？这些日子以来，我见过了太多，研究所的成果不一而足，雷老师的身影越来越伟岸。从前，我还抱有疑虑，甚至怀疑雷老师，但是现在我可以确信：一轮红日出现在了世界的乐山，它将永远的取代腐朽落后的管科。"
 LSW_Research_A5:0 "安排科技研究专员"
 LSW_Research_A5_desc:0 "安排科技研究专员"
 LSW_Research_B1:0 "开展军事研究"
 LSW_Research_B1_desc:0 "雷氏军事千言万语汇成一句话——运力有理！"
 LSW_Research_B2:0 "研究喷水式飞机"
 LSW_Research_B2_desc:0 "从运动力的角度来看，现在的飞机研究简直就是破铜烂铁。飞机起飞，有运动力L＝kmv，m减少，v变大。以此类推，我们只需要以水，或者其他什么便宜货当飞机燃料，就可以不断飞行，哪里要得了什么油呢？"
 LSW_Research_B3:0 "研究雷氏统计学"
 LSW_Research_B3_desc:0 "虽然不是很愿意承认，但现在的一切实验，观测数据几乎都与雷氏创新理论有冲突，它们毕竟是管科的。而我们必须火速制造出一套全新的，区别于腐败管科的统计学，使其贴合雷老师的颅内实验数据，尤其是对人口的计算。"
 LSW_Research_B4:0 "研究雷氏生物学"
 LSW_Research_B4_desc:0 "有雷氏创新数学a乘0得a。人静止不动，有运动力L＝kmv，v＝0，运动力L会随着时间的变化而增长。故：人在静止不动时，运动力越来越大，生命力越来越强。基于此理论，我们将对军队进行雷氏基因改造。"
 LSW_Research_B5:0 "安排军事研究专员"
 LSW_Research_B5_desc:0 "安排军事研究专员"
 LSW_Research_C1:0 "开展工业研究"
 LSW_Research_C1_desc:0 "雷老师几乎从不拿他的创新理论指导具体工程问题。他只是亦步亦趋地承认那些管科造物。这不该是一位大学者的样子，因此我们工程研究所便要扛起修正的大旗，为雷氏创新理论在工程界划定地盘。"
 LSW_Research_C2:0 "研究钻井工程"
 LSW_Research_C2_desc:0 "我们的这项研究来自一段人尽皆知的秘密，我们无法说明，只能言尽于此，但是我们从那只言片语中了解了大概。参考着雷氏理论，我们把一张张关于井，井盖，钻井的创新研究便摆在了每个人的案头。它们将会为826的科学与实践建设添上自己的颜色。"
 LSW_Research_C3:0 "研究电磁粒子"
 LSW_Research_C3_desc:0 "洗脸时指尖跳跃的电磁粒子，是雷不变的信仰。不出意外，我们的研究获得了大力支持。我们的钱包鼓鼓的，粮食好，干劲足，自然很好的完成了任务，有什么好说的呢？"
 LSW_Research_C4:0 "研究建筑工程"
 LSW_Research_C4_desc:0 "雷氏创新在其他领域都取得了不错的进展，只有建筑领域尚付阙如，可雷老师几乎从不涉及这个领域，我们只好自力更生，毕竟雷老师已经太老了，我们也不知道会不会有一天……"
 LSW_Research_C5:0 "安排工业研究专员"
 LSW_Research_C5_desc:0 "安排工业研究专员"
