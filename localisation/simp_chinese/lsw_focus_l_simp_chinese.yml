LSW_death_lei3:0 "重视资源开采"
LSW_death_lei3_desc:0 "多开采资源，才能多卖钱。"
LSW_death_lei_end:0 "经济腾飞"
LSW_death_lei_end_desc:0 "雷勇的大手挽救了经济！"
LSW_death_qiu:0 "以牙还牙"
LSW_death_qiu_desc:0 "雷绍武的死亡必有幕后黑手。想要对幕后黑手复仇，就要重整混乱的军队，而雷绍武之友邱白林担负起了这个重任。"
LSW_death_qiu1:0 "长期训练"
LSW_death_qiu1_desc:0 "新兵不能投入作战，我们需要更多老兵。为此，需要更久的训练。"
LSW_death_qiu2:0 "精英军队"
