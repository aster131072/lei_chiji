LSW_death_lei_desc:0 "雷绍武之子雷勇对雷氏理论并不感兴趣，但他可以用一种全新的手段提振经济。"
LSW_death_lei1:0 "发行井盖证券"
LSW_death_lei1_desc:0 "21世纪的证券系统对这个时代是降维打击。"
LSW_death_lei2:0 "采用绩效考核"
